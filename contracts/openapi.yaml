        type:
          $ref: "#/components/schemas/AccountType"
        provider_key:
          type: ["string", "null"]
          maxLength: 32
        currency:
          type: string
          minLength: 3
          maxLength: 3
        opening_balance:
          $ref: "#/components/schemas/Rupiah"
        opening_date:
          $ref: "#/components/schemas/Date"
        include_in_total:
          type: boolean
        sort_order:
          type: integer
        archived_at:
