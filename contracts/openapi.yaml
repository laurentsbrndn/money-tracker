        category_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
          description: Null untuk income tanpa kategori
        amount:
          $ref: "#/components/schemas/Rupiah"

    MonthlyReport:
      type: object
      required:
        - monthly_summary
        - accounts
        - totals
        - budget
        - expense_by_category
        - income_by_category
      properties:
        monthly_summary:
          $ref: "#/components/schemas/MonthlySummary"
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/AccountReconciliation"
        totals:
          $ref: "#/components/schemas/ReportTotals"
        budget:
          $ref: "#/components/schemas/ReportBudget"
        expense_by_category:
          type: array
          description: Urut nominal menurun
          items:
            $ref: "#/components/schemas/CategoryTotal"
        income_by_category:
          type: array
          items:
            $ref: "#/components/schemas/CategoryTotal"

    TrendMonth:
      type: object
      required: [month, income, expense, surplus, savings, adjustments]
      properties:
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        income:
          $ref: "#/components/schemas/Rupiah"
        expense:
          $ref: "#/components/schemas/Rupiah"
        surplus:
          $ref: "#/components/schemas/Rupiah"
        savings:
          $ref: "#/components/schemas/Rupiah"
        adjustments:
          $ref: "#/components/schemas/Rupiah"

    # ---------- Webhook RevenueCat ----------
    RevenueCatWebhook:
      type: object
      required: [event]
      properties:
        api_version:
          type: string
        event:
          type: object
          required: [id, type, app_user_id, event_timestamp_ms]
          additionalProperties: true
          properties:
            id:
              type: string
              description: ID event (kunci idempotensi)
            type:
              type: string
              examples: [INITIAL_PURCHASE, RENEWAL, EXPIRATION]
            app_user_id:
              type: string
              description: User ID server, atau `$RCAnonymousID:…` (disimpan, tidak diproses)
            event_timestamp_ms:
              type: integer
              format: int64
