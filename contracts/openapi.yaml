        - snapshot_date
        - amount
        - note
        - created_at
        - updated_at
        - deleted_at
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        account_id:
          $ref: "#/components/schemas/Uuid"
        snapshot_date:
          $ref: "#/components/schemas/Date"
        amount:
          $ref: "#/components/schemas/Rupiah"
        note:
          type: ["string", "null"]
          maxLength: 255
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        deleted_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    TransactionRow:
      type: object
      required:
        - id
        - type
        - status
        - transaction_date
        - amount
        - currency
        - account_id
        - to_account_id
        - category_id
        - allocation
        - source
        - note
        - linked_transaction_id
        - recurring_rule_id
        - created_at
        - updated_at
        - deleted_at
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        type:
          $ref: "#/components/schemas/TransactionType"
        status:
          $ref: "#/components/schemas/TransactionStatus"
        transaction_date:
          $ref: "#/components/schemas/Date"
        amount:
          $ref: "#/components/schemas/Rupiah"
          description: |
            > 0 untuk income/expense/transfer. Untuk adjustment ≠ 0 dan bertanda.
