      properties:
        entity:
          type: string
          enum: [budget_goals]
        id:
          $ref: "#/components/schemas/Uuid"
        server_version:
          type: integer
          format: int64
        data:
          $ref: "#/components/schemas/BudgetGoalRow"


    PullMeta:
      type: object
      required: [entitlement, server_time]
      properties:
