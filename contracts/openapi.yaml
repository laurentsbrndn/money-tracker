        - id
        - type
        - amount
        - account_id
        - to_account_id
        - category_id
        - allocation
        - source
        - note
        - frequency
        - interval_count
        - day_of_week
        - day_of_month
        - month_of_year
        - start_date
        - end_date
        - mode
        - is_paused
        - last_generated_date
        - created_at
        - updated_at
        - deleted_at
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        type:
          type: string
          enum: [income, expense, transfer]
        amount:
          $ref: "#/components/schemas/Rupiah"
        account_id:
          $ref: "#/components/schemas/Uuid"
        to_account_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        category_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        allocation:
          oneOf:
            - $ref: "#/components/schemas/Allocation"
            - type: "null"
        source:
          type: ["string", "null"]
          maxLength: 100
        note:
          type: ["string", "null"]
          maxLength: 255
        frequency:
          $ref: "#/components/schemas/RecurringFrequency"
        interval_count:
          type: integer
          minimum: 1
          default: 1
        day_of_week:
          type: ["integer", "null"]
          minimum: 1
          maximum: 7
