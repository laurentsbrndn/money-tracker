            - type: "null"
        category_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        allocation:
          oneOf:
            - $ref: "#/components/schemas/Allocation"
            - type: "null"
        source:
          type: ["string", "null"]
          maxLength: 100
        note:
          type: ["string", "null"]
          maxLength: 255
        linked_transaction_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        recurring_rule_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        deleted_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    RecurringRuleRow:
      type: object
