        day_of_month:
          type: ["integer", "null"]
          minimum: 1
          maximum: 31
        month_of_year:
          type: ["integer", "null"]
          minimum: 1
          maximum: 12
        start_date:
          $ref: "#/components/schemas/Date"
        end_date:
          oneOf:
            - $ref: "#/components/schemas/Date"
            - type: "null"
        mode:
          $ref: "#/components/schemas/RecurringMode"
        is_paused:
          type: boolean
        last_generated_date:
          oneOf:
            - $ref: "#/components/schemas/Date"
            - type: "null"
        created_at:
