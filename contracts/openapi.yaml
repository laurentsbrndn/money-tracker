          accounts: "#/components/schemas/PullChangeAccount"
          balance_snapshots: "#/components/schemas/PullChangeBalanceSnapshot"
          transactions: "#/components/schemas/PullChangeTransaction"
          recurring_rules: "#/components/schemas/PullChangeRecurringRule"
          budget_goals: "#/components/schemas/PullChangeBudgetGoal"
    PullChangeUserSettings:
