          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        deleted_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    # ---------- Sync: push ----------
    PushChange:
      description: |
        Satu perubahan. Varian ditentukan oleh `entity` (discriminator); `data` bertipe baris
        entitas itu. `data` (seluruh baris) wajib untuk `op = upsert` dan tidak ada untuk
        `op = delete`. Kolom `user_id`, `server_version`, dan `server_updated_at` diabaikan
        bila dikirim. Nama entitas di luar daftar dijawab server per entri sebagai
        `rejected` `unknown_entity` (bukan 422 untuk seluruh request).
      oneOf:
        - $ref: "#/components/schemas/PushChangeUserSettings"
        - $ref: "#/components/schemas/PushChangeCategory"
        - $ref: "#/components/schemas/PushChangeAccount"
        - $ref: "#/components/schemas/PushChangeBalanceSnapshot"
        - $ref: "#/components/schemas/PushChangeTransaction"
        - $ref: "#/components/schemas/PushChangeRecurringRule"
        - $ref: "#/components/schemas/PushChangeBudgetGoal"
      discriminator:
        propertyName: entity
        mapping:
          user_settings: "#/components/schemas/PushChangeUserSettings"
          categories: "#/components/schemas/PushChangeCategory"
          accounts: "#/components/schemas/PushChangeAccount"
          balance_snapshots: "#/components/schemas/PushChangeBalanceSnapshot"
          transactions: "#/components/schemas/PushChangeTransaction"
          recurring_rules: "#/components/schemas/PushChangeRecurringRule"
          budget_goals: "#/components/schemas/PushChangeBudgetGoal"
    PushChangeUserSettings:
      type: object
      required: [entity, op, id, updated_at]
      properties:
        entity:
          type: string
          enum: [user_settings]
        op:
          type: string
          enum: [upsert, delete]
        id:
          $ref: "#/components/schemas/Uuid"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        data:
          $ref: "#/components/schemas/UserSettingsRow"

    PushChangeCategory:
      type: object
      required: [entity, op, id, updated_at]
      properties:
        entity:
          type: string
          enum: [categories]
        op:
          type: string
          enum: [upsert, delete]
        id:
          $ref: "#/components/schemas/Uuid"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        data:
          $ref: "#/components/schemas/CategoryRow"

    PushChangeAccount:
      type: object
      required: [entity, op, id, updated_at]
      properties:
        entity:
          type: string
          enum: [accounts]
        op:
          type: string
          enum: [upsert, delete]
        id:
          $ref: "#/components/schemas/Uuid"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        data:
          $ref: "#/components/schemas/AccountRow"

    PushChangeBalanceSnapshot:
      type: object
      required: [entity, op, id, updated_at]
      properties:
        entity:
          type: string
          enum: [balance_snapshots]
        op:
          type: string
          enum: [upsert, delete]
        id:
          $ref: "#/components/schemas/Uuid"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        data:
          $ref: "#/components/schemas/BalanceSnapshotRow"

    PushChangeTransaction:
      type: object
      required: [entity, op, id, updated_at]
      properties:
        entity:
          type: string
          enum: [transactions]
        op:
          type: string
          enum: [upsert, delete]
        id:
          $ref: "#/components/schemas/Uuid"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        data:
          $ref: "#/components/schemas/TransactionRow"

    PushChangeRecurringRule:
      type: object
      required: [entity, op, id, updated_at]
      properties:
        entity:
          type: string
          enum: [recurring_rules]
        op:
          type: string
          enum: [upsert, delete]
        id:
          $ref: "#/components/schemas/Uuid"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        data:
          $ref: "#/components/schemas/RecurringRuleRow"

    PushChangeBudgetGoal:
      type: object
      required: [entity, op, id, updated_at]
      properties:
        entity:
          type: string
          enum: [budget_goals]
        op:
          type: string
          enum: [upsert, delete]
        id:
          $ref: "#/components/schemas/Uuid"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        data:
          $ref: "#/components/schemas/BudgetGoalRow"


    PushRequest:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/PushChange"

    PushResultStatus:
      type: string
      enum: [applied, stale, rejected]

    PushRejectCode:
      type: string
      enum: [validation, reference_missing, forbidden, plan_limit, unknown_entity]

    PushError:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          $ref: "#/components/schemas/PushRejectCode"
        message:
          type: string
        retryable:
          type: boolean
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"

    PushResult:
      type: object
      required: [entity, id, status]
      properties:
        entity:
          type: string
        id:
          $ref: "#/components/schemas/Uuid"
        status:
          $ref: "#/components/schemas/PushResultStatus"
        server_version:
          type: ["integer", "null"]
          format: int64
          description: Null untuk `delete` no-op (baris tidak ada di server) dan untuk `rejected`
        error:
          $ref: "#/components/schemas/PushError"

    PushResponse:
      type: object
      required: [results, server_time]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/PushResult"
        server_time:
          $ref: "#/components/schemas/Timestamp"

    # ---------- Sync: pull ----------
    PullChange:
      description: |
        Varian ditentukan oleh `entity` (discriminator). `data` berisi seluruh baris termasuk
