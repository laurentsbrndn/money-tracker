          description: Selalu tanggal 1
        needs_pct:
          type: integer
          minimum: 0
          maximum: 100
        wants_pct:
          type: integer
          minimum: 0
          maximum: 100
        savings_pct:
          type: integer
          minimum: 0
          maximum: 100
          description: needs + wants + savings = 100
        planned_income:
          type: ["integer", "null"]
          format: int64
          minimum: 0
