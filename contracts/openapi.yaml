openapi: 3.1.0
info:
  title: Money Tracker API
  version: 1.0.0
  description: |
    Sumber kebenaran API Money Tracker. Ringkasan teks ada di `docs/API.md`,
    protokol sinkronisasi di `docs/SYNC_PROTOCOL.md`.

    Konvensi: JSON UTF-8 `snake_case`; uang integer rupiah; timestamp RFC 3339 UTC;
    tanggal `YYYY-MM-DD`; bulan `YYYY-MM`. Semua error memakai `application/problem+json`.

    **Header identitas client.** Semua endpoint yang dipanggil app (`/v1/auth/*`, `/v1/me*`,
    `/v1/sync/*`, `/v1/reports/*`) mewajibkan `X-Device-ID` (ID instalasi, 1-64 karakter),
    `X-Platform` (`android` atau `ios`), dan `X-App-Version` (semver, contoh `1.0.0`);
    `X-Request-ID` opsional. `X-Device-Name` (maksimal 100 karakter) opsional dan dibaca
    saat register, login, dan login OAuth untuk menamai perangkat. Header ini tidak
    dideklarasikan per operasi: client menambahkannya lewat interceptor/middleware HTTP.
    Header yang hilang atau tidak valid dijawab `422` (`code = validation`), dan versi di
    bawah minimum dijawab `426` (`upgrade_required`). Pengecualian: `/healthz`, webhook
    RevenueCat, dan endpoint cron `/v1/internal/cron/*`. Lihat `docs/API.md` §1.
servers:
  - url: https://{project}.vercel.app
    description: Production
    variables:
      project:
        default: money-tracker
  - url: http://localhost:8080
    description: Lokal

tags:
  - name: auth
    description: Registrasi, login, token, verifikasi email, reset password
  - name: me
    description: Profil dan penghapusan akun
  - name: sync
    description: Push/pull offline-first
  - name: reports
    description: Laporan bulanan dan tren
  - name: billing
    description: Entitlement dan webhook RevenueCat
  - name: internal
    description: Endpoint cron (Vercel Cron)
  - name: health
    description: Cek kesehatan

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      summary: Cek kesehatan (database, timeout maksimal 2 detik)
      security: []
      responses:
        "200":
          description: Database terjangkau
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database tidak terjangkau (tanpa detail error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Daftar dengan email dan password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Terdaftar; kode verifikasi dikirim ke email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Login dengan email dan password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "423":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/auth/oauth/apple:
    post:
      tags: [auth]
      operationId: loginWithApple
      summary: Login atau daftar dengan Apple
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleLoginRequest"
      responses:
        "200":
          description: Berhasil (`is_new_user` true bila user baru)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/auth/oauth/google:
    post:
      tags: [auth]
      operationId: loginWithGoogle
      summary: Login atau daftar dengan Google
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginRequest"
      responses:
        "200":
          description: Berhasil (`is_new_user` true bila user baru)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      summary: Tukar refresh token dengan token baru (rotasi)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token baru
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Cabut refresh token
      description: |
        Publik. Autentikasi lewat refresh token di body (bukan Bearer), karena access token
        bisa sudah kedaluwarsa. Token yang tidak dikenal tetap dijawab 204.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Token dicabut
        "422":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/auth/email/verification:
    post:
      tags: [auth]
      operationId: resendEmailVerification
      summary: Kirim ulang kode verifikasi email (maks 1 per 60 detik)
      responses:
        "202":
          description: Kode dikirim
        "401":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/auth/email/verify:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Verifikasi email dengan kode 6 digit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Email terverifikasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Minta kode reset password
      description: Selalu 202, tidak membocorkan apakah email terdaftar.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: Diterima
        "422":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Reset password dengan kode; semua refresh token user dicabut
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password diganti
        "422":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/auth/password/change:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Ubah password; refresh token lain dicabut
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password diganti
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: Profil dan entitlement
      responses:
        "200":
          description: Profil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [me]
      operationId: updateMe
      summary: Ubah nama
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Profil terbaru
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [me]
      operationId: deleteMe
      summary: Minta hapus akun (status `pending_deletion`, semua token dicabut)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteMeRequest"
      responses:
        "202":
          description: Penghapusan dijadwalkan
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/me/entitlements:
    get:
      tags: [billing]
      operationId: getEntitlements
      summary: Status premium
      responses:
        "200":
          description: Entitlement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlement"
        "401":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/sync/push:
    post:
      tags: [sync]
      operationId: syncPush
      summary: Kirim perubahan dari outbox
      description: |
        Maksimal 100 entri per request, body maksimal 1 MB. Mengirim ulang dengan
        `Idempotency-Key` yang sama mengembalikan respons yang tersimpan.
        Lihat `docs/SYNC_PROTOCOL.md` §8.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID batch
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushRequest"
      responses:
        "200":
          description: Hasil per entri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/sync/pull:
    get:
      tags: [sync]
      operationId: syncPull
      summary: Ambil perubahan sejak cursor
      description: Lihat `docs/SYNC_PROTOCOL.md` §9.
      parameters:
        - name: since
          in: query
          required: true
          description: Cursor (`server_version` terakhir yang sudah diterapkan), 0 untuk initial sync
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        "200":
          description: Halaman perubahan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/reports/monthly:
    get:
      tags: [reports]
      operationId: getMonthlyReport
      summary: Laporan bulanan
      description: Paket gratis dibatasi bulan berjalan + 2 bulan sebelumnya (`history_limit`).
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            examples: ["2026-11"]
      responses:
        "200":
          description: Laporan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyReport"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/reports/trend:
    get:
      tags: [reports]
      operationId: getTrendReport
      summary: Tren bulanan (premium)
      parameters:
        - name: months
          in: query
          required: false
          schema:
            type: integer
            enum: [6, 12]
            default: 6
      responses:
        "200":
          description: Array per bulan
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendMonth"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/billing/webhooks/revenuecat:
    post:
      tags: [billing]
      operationId: revenueCatWebhook
      summary: Webhook RevenueCat (idempoten via `event.id`)
      description: |
        Event disimpan, lalu diproses. Event yang gagal diproses tetap dibalas 200 setelah
        tersimpan, dengan `error` terisi di `billing_events`.
      security:
        - webhookAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevenueCatWebhook"
      responses:
        "200":
          description: Diterima
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/internal/cron/recurring:
    get:
      tags: [internal]
      operationId: cronRecurring
      summary: Buat kemunculan transaksi berulang yang jatuh tempo (0 18 * * * UTC)
      security:
        - cronAuth: []
      responses:
        "200":
          description: Selesai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronResult"
        "401":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /v1/internal/cron/maintenance:
    get:
      tags: [internal]
      operationId: cronMaintenance
      summary: Bersihkan data kedaluwarsa dan hapus permanen user (30 18 * * * UTC)
      security:
        - cronAuth: []
      responses:
        "200":
          description: Selesai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronResult"
        "401":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT (HS256, 15 menit)
    cronAuth:
      type: http
      scheme: bearer
      description: "`Authorization: Bearer <CRON_SECRET>`"
    webhookAuth:
      type: http
      scheme: bearer
      description: "`Authorization: Bearer <REVENUECAT_WEBHOOK_SECRET>`"

  responses:
    Problem:
      description: Error (RFC 9457). Kode HTTP dan `code` ada di tabel `docs/API.md` §1.2.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    # ---------- Umum ----------
    Uuid:
      type: string
      format: uuid
      description: UUID huruf kecil dengan tanda hubung
    Date:
      type: string
      format: date
      examples: ["2026-11-02"]
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 UTC, disarankan dengan milidetik
      examples: ["2026-11-02T14:05:00.123Z"]
    Rupiah:
      type: integer
      format: int64
      description: Rupiah utuh

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]

    CronResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    ProblemCode:
      type: string
      enum:
        - validation
        - unauthorized
        - token_expired
        - refresh_invalid
        - refresh_reused
        - invalid_credentials
        - account_locked
        - email_taken
        - code_invalid
        - code_expired
        - too_many_attempts
        - forbidden
        - not_found
        - premium_required
        - history_limit
        - payload_too_large
        - rate_limited
        - upgrade_required
        - internal

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          examples: ["https://moneytracker.app/errors/validation"]
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          $ref: "#/components/schemas/ProblemCode"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        retry_after_seconds:
          type: integer
          description: Diisi untuk `account_locked`
        request_id:
          type: string

    # ---------- Auth & user ----------
    User:
      type: object
      required: [id, name, email_verified, has_password, providers]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        email:
          type: ["string", "null"]
          format: email
        email_verified:
          type: boolean
        has_password:
          type: boolean
        providers:
          type: array
          items:
            $ref: "#/components/schemas/AuthProvider"

    AuthProvider:
      type: string
      enum: [apple, google]

    UserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    MeResponse:
      type: object
      required: [user, entitlement]
      properties:
        user:
          $ref: "#/components/schemas/User"
        entitlement:
          $ref: "#/components/schemas/Entitlement"

    Tokens:
      type: object
      required: [access_token, access_expires_at, refresh_token, refresh_expires_at]
      properties:
        access_token:
          type: string
        access_expires_at:
          $ref: "#/components/schemas/Timestamp"
        refresh_token:
          type: string
        refresh_expires_at:
          $ref: "#/components/schemas/Timestamp"

    AuthResponse:
      type: object
      required: [user, tokens, is_new_user]
      properties:
        user:
          $ref: "#/components/schemas/User"
        tokens:
          $ref: "#/components/schemas/Tokens"
        is_new_user:
          type: boolean

    RefreshResponse:
      type: object
      required: [tokens]
      properties:
        tokens:
          $ref: "#/components/schemas/Tokens"

    RegisterRequest:
      type: object
      required: [name, email, password, timezone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 72
        timezone:
          type: string
          description: Nama IANA
          examples: ["Asia/Jakarta"]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AppleLoginRequest:
      type: object
      required: [identity_token, timezone]
      properties:
        identity_token:
          type: string
        name:
          type: string
          description: Hanya ada saat login Apple pertama
          maxLength: 100
        timezone:
          type: string

    GoogleLoginRequest:
      type: object
      required: [id_token, timezone]
      properties:
        id_token:
          type: string
        timezone:
          type: string

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    VerifyEmailRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: '^\d{6}$'

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required: [email, code, new_password]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^\d{6}$'
